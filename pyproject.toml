[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fast_gsbs"
version = "1.0.0"
description = "A faster implementation of GSBS (Greedy State Boundary Search), based on statesegmentation 0.0.6"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tiannan Wang", email = "wangtiannan728@gmail.com" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.urls]
"Reference implementation" = "https://github.com/lgeerligs/statesegmentation"

[tool.setuptools]
packages = ["fast_gsbs"]
